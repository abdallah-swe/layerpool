[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "layerpool"
dynamic = ["version"]
description = "Train one model on all of your devices: layers split across GPUs, Apple Silicon and CPUs, with your own training code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "abdallah-swe" }]
keywords = ["distributed-training", "pipeline-parallelism", "lora", "qlora", "fine-tuning", "dpo", "mlx", "pytorch", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4",
    "huggingface_hub>=0.34",
    "psutil>=5.9",
    "torch>=2.6",
    "pyyaml>=6",
    "jinja2>=3.1",
    "transformers>=4.56",
    "accelerate>=1.10",
    "mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "bitsandbytes>=0.46.1; sys_platform != 'darwin'",
    "nvidia-ml-py>=12; sys_platform != 'darwin'",
]

[project.optional-dependencies]
hf = ["peft>=0.13", "trl>=1.15", "datasets>=4.7"]

[project.scripts]
layerpool = "layerpool.cli:main"

[project.urls]
Homepage = "https://github.com/abdallah-swe/layerpool"
Repository = "https://github.com/abdallah-swe/layerpool"
Issues = "https://github.com/abdallah-swe/layerpool/issues"

[tool.hatch.version]
path = "src/layerpool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/layerpool"]

[tool.hatch.build.targets.sdist]
include = ["src/layerpool", "README.md", "LICENSE", "pyproject.toml"]
