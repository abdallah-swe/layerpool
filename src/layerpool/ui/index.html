<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layerpool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320' fill='%233e5f52'%3E%3Cpath d='M143 15 L223 15 L181 99 L101 99Z'/%3E%3Cpath d='M101 109 L223 109 L199 157 L77 157Z'/%3E%3Cpath d='M135 167 L243 167 L119 305 L159 215 L111 215Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui?f=style.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg class="mark" viewBox="0 0 320 320" aria-hidden="true"><path d="M143 15 L223 15 L181 99 L101 99Z"/><path d="M101 109 L223 109 L199 157 L77 157Z"/><path d="M135 167 L243 167 L119 305 L159 215 L111 215Z"/></svg>layerpool <span id="version" class="muted"></span></div>
  <div class="summary" id="summary">connecting…</div>
  <button id="add-device" class="primary">Add device</button>
</header>

<main>
  <section class="panel">
    <div class="run-head">
      <div class="run-title">
        <div class="label">Run</div>
        <div class="run-name" id="run-name">No run yet</div>
        <div class="muted" id="run-model"></div>
      </div>
      <div class="run-actions" id="run-actions" hidden>
        <label class="check" data-tip="While training, layerpool measures each device and moves layers to faster ones when that pays off. Turn it off to keep the split as it is (a device joining, leaving or changing its settings still splits again).">
          <input type="checkbox" id="rebalance"> Rebalance automatically</label>
        <button id="resplit" class="ghost small" data-tip="Split the layers across the devices again now, from their current settings and measured speed.">Split again</button>
        <button id="end-run" class="ghost danger small">End run</button>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="block-title">Layers on each device <span class="hint" data-tip="The model's repeated blocks, split across the devices in order. Each device runs its share and passes the result to the next one. A wider band means more layers. Hover a band for its numbers.">?</span></div>
    <div class="pipe" id="pipe"></div>
    <div class="charts">
      <div class="chart" id="chart-loss"></div>
      <div class="chart" id="chart-speed"></div>
    </div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>Devices</h2><span class="count" id="device-count"></span></div>
    <div class="cards" id="pending"></div>
    <div class="cards" id="devices"></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>Events</h2><span class="muted small-text">newest first</span></div>
    <ol class="events" id="events"></ol>
  </section>
</main>

<div id="tip" class="tip" hidden></div>

<dialog id="invite-dialog">
  <form method="dialog">
    <h3>Add a device</h3>
    <p class="muted" id="invite-validity">The code works once and expires in 24 hours.</p>
    <div class="row">
      <label class="check"><input type="checkbox" id="invite-reusable"> Reusable (several devices with one code)</label>
      <span class="spacer"></span>
      <label class="check">Valid for <select id="invite-hours"><option value="1">1 hour</option><option value="24" selected>24 hours</option><option value="168">7 days</option></select></label>
    </div>
    <div class="tabs">
      <button type="button" data-tab="terminal" class="tab on">Terminal</button>
      <button type="button" data-tab="notebook" class="tab">Notebook cell</button>
    </div>
    <pre id="invite-text"></pre>
    <p class="muted" id="invite-note"></p>
    <p class="muted small-text">A device can also join without a code: <code>layerpool join URL</code>. It then shows up here to approve.</p>
    <div class="row">
      <button type="button" id="invite-copy" class="primary">Copy</button>
      <button type="button" id="invite-new" class="ghost">New code</button>
      <span class="spacer"></span>
      <button class="ghost">Close</button>
    </div>
  </form>
</dialog>

<script src="/ui?f=app.js"></script>
</body>
</html>
